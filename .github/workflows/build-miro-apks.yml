name: Qualified MIRO Crystal producer prerequisite
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-miro:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require registered producer deployment
        shell: sh
        run: |
          test -x /opt/aici/android-producer/current/runtime/grease || { echo '::error::BLOCKED: qualified Android producer release and stable-lane approval are unavailable'; exit 1; }
          exec /usr/bin/env -i PATH=/usr/bin:/bin /opt/aici/android-producer/current/runtime/grease /opt/aici/android-producer/current/policy/android-producer/supervise.ysh
# This repository does not deploy policy or choose a historical release.
# Final consumer publication uses Cat Food's authenticated deliver-apk.ysh.
# Emulator/MIRO replacement, pinch-zoom and wireframe need separate evidence.
