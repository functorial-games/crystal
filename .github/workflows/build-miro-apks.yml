name: Build MIRO crystal APK prototypes

on:
  push:
    branches:
      - test/miro-apk-prototypes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Crystal exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out canonical android-NDK packager candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/android-NDK
          ref: 7aa8e2dbb0e4d2726382e6c47994a710977563a6
          path: .android-ndk
          sparse-checkout: |
            apk/build-nativeactivity-apk.sh
          sparse-checkout-cone-mode: false

      - name: Check out stable public test signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - name: Java 17 for Android SDK signing tools
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android components
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Enforce ICK-or-NDK declaration
        uses: isomorphisms/ai-ci@3f542ba91c86a0a66a4c16c779f205d075b02871
        with:
          root: .
          suite: .github/ai-ci/suite.tsv

      - name: Build ARMv7 native libraries
        shell: bash
        run: bash .github/scripts/build-miro.sh

      - name: Package direct NativeActivity APKs
        shell: bash
        env:
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
          ANDROID_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
          ANDROID_KEYSTORE_TYPE: PKCS12
          ANDROID_KEY_ALIAS: wegert-debug
          ANDROID_STORE_PASSWORD: wegert-debug
          ANDROID_KEY_PASSWORD: wegert-debug
          ANDROID_EXPECTED_CERT_SHA256: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
          ANDROID_VERSION_CODE: "2"
          ANDROID_VERSION_NAME: "0.2-inspection"
          ANDROID_MIN_SDK: "21"
          ANDROID_TARGET_SDK: "34"
          ANDROID_REQUIRE_NO_DEX: "1"
          ANDROID_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          package_one() {
            flavor=$1
            package=$2
            export ANDROID_PACKAGE_ID="$package"
            bash .android-ndk/apk/build-nativeactivity-apk.sh \
              "android/quartz-manifest.xml" \
              "build/native/$flavor/armeabi-v7a/libcrystal.so" \
              armeabi-v7a \
              "dist/crystal-$flavor-miro-armeabi-v7a.apk"
          }
          package_one halite org.isomorphisms.crystal.halite
          package_one quartz org.isomorphisms.crystal.quartz
          package_one bismuth org.isomorphisms.crystal.bismuth
          cp build/receipts/* dist/
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Verify Halite against candidate central registry
        uses: isomorphisms/ai-ci/android-signing@3f542ba91c86a0a66a4c16c779f205d075b02871
        with:
          apk: dist/crystal-halite-miro-armeabi-v7a.apk
          lane: test

      - name: Verify Quartz against candidate central registry
        uses: isomorphisms/ai-ci/android-signing@3f542ba91c86a0a66a4c16c779f205d075b02871
        with:
          apk: dist/crystal-quartz-miro-armeabi-v7a.apk
          lane: test

      - name: Verify Bismuth against candidate central registry
        uses: isomorphisms/ai-ci/android-signing@3f542ba91c86a0a66a4c16c779f205d075b02871
        with:
          apk: dist/crystal-bismuth-miro-armeabi-v7a.apk
          lane: test

      - name: Retain candidate APKs and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crystal-miro-direct-ndk-candidate
          path: dist/
          if-no-files-found: error


  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Crystal exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out canonical android-NDK packager candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/android-NDK
          ref: 7aa8e2dbb0e4d2726382e6c47994a710977563a6
          path: .android-ndk
          sparse-checkout: |
            apk/build-nativeactivity-apk.sh
          sparse-checkout-cone-mode: false

      - name: Check out stable public test signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - name: Java 17 for Android SDK signing tools
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android emulator components
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "system-images;android-34;default;x86_64"

      - name: Build x86_64 diagnostic libraries
        shell: bash
        run: bash .github/scripts/build-miro.sh x86_64

      - name: Package direct x86_64 NativeActivity APKs
        shell: bash
        env:
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
          ANDROID_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
          ANDROID_KEYSTORE_TYPE: PKCS12
          ANDROID_KEY_ALIAS: wegert-debug
          ANDROID_STORE_PASSWORD: wegert-debug
          ANDROID_KEY_PASSWORD: wegert-debug
          ANDROID_EXPECTED_CERT_SHA256: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
          ANDROID_VERSION_CODE: "2"
          ANDROID_VERSION_NAME: "0.2-emulator"
          ANDROID_MIN_SDK: "21"
          ANDROID_TARGET_SDK: "34"
          ANDROID_REQUIRE_NO_DEX: "1"
          ANDROID_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p emulator-apks
          package_one() {
            flavor=$1
            package=$2
            export ANDROID_PACKAGE_ID="$package"
            bash .android-ndk/apk/build-nativeactivity-apk.sh \
              "android/quartz-manifest.xml" \
              "build/native/$flavor/x86_64/libcrystal.so" \
              x86_64 \
              "emulator-apks/crystal-$flavor-x86_64.apk"
          }
          package_one halite org.isomorphisms.crystal.halite
          package_one quartz org.isomorphisms.crystal.quartz
          package_one bismuth org.isomorphisms.crystal.bismuth
          unzip -l emulator-apks/crystal-halite-x86_64.apk | grep 'lib/x86_64/libcrystal.so'
          unzip -l emulator-apks/crystal-quartz-x86_64.apk | grep 'lib/x86_64/libcrystal.so'
          unzip -l emulator-apks/crystal-bismuth-x86_64.apk | grep 'lib/x86_64/libcrystal.so'

      - name: Start Android 14 emulator
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

          AVDMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          test -x "$AVDMANAGER"
          echo no | "$AVDMANAGER" create avd \
            --name crystal-ci \
            --package "system-images;android-34;default;x86_64" \
            --force

          mkdir -p emulator-evidence
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd crystal-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > emulator-evidence/emulator-stdout.txt 2>&1 &
          echo $! > emulator-evidence/emulator.pid

      - name: Exercise render modes and drag
        shell: bash
        run: bash .github/scripts/emulator-smoke.sh emulator-evidence

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crystal-emulator-evidence
          path: emulator-evidence/
          if-no-files-found: warn
