name: Build MIRO crystal APK prototypes

on:
  push:
    branches:
      - test/miro-apk-prototypes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out stable public test signer
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android components
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Build ARMv7 native libraries
        shell: bash
        run: bash .github/scripts/build-miro.sh

      - name: Package APKs with stable test signer
        shell: bash
        env:
          CRYSTAL_TEST_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
        run: |
          gradle --no-daemon :app:assembleHaliteDebug :app:assembleQuartzDebug :app:assembleBismuthDebug
          mkdir -p dist
          cp app/build/outputs/apk/halite/debug/app-halite-debug.apk dist/crystal-halite-miro-armeabi-v7a.apk
          cp app/build/outputs/apk/quartz/debug/app-quartz-debug.apk dist/crystal-quartz-miro-armeabi-v7a.apk
          cp app/build/outputs/apk/bismuth/debug/app-bismuth-debug.apk dist/crystal-bismuth-miro-armeabi-v7a.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Verify Halite signer
        uses: isomorphisms/ai-ci/android-signing@f99f2025fd085a3cda6d19e5e8a6deeeed7bcaf9
        with:
          apk: dist/crystal-halite-miro-armeabi-v7a.apk
          lane: test

      - name: Verify Quartz signer
        uses: isomorphisms/ai-ci/android-signing@f99f2025fd085a3cda6d19e5e8a6deeeed7bcaf9
        with:
          apk: dist/crystal-quartz-miro-armeabi-v7a.apk
          lane: test

      - name: Verify Bismuth signer
        uses: isomorphisms/ai-ci/android-signing@f99f2025fd085a3cda6d19e5e8a6deeeed7bcaf9
        with:
          apk: dist/crystal-bismuth-miro-armeabi-v7a.apk
          lane: test

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: crystal-miro-apks
          path: dist/
          if-no-files-found: error
