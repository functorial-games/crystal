plugins {
    id "com.android.application"
}

def crystalTestKeystorePath = System.getenv("CRYSTAL_TEST_KEYSTORE")
if (crystalTestKeystorePath == null || crystalTestKeystorePath.trim().isEmpty()) {
    throw new GradleException("CRYSTAL_TEST_KEYSTORE is required; refusing ephemeral Gradle debug signing")
}

android {
    namespace "org.isomorphisms.crystal"
    compileSdk 34

    signingConfigs {
        stableTest {
            storeFile file(crystalTestKeystorePath)
            storePassword "wegert-debug"
            keyAlias "wegert-debug"
            keyPassword "wegert-debug"
            storeType "pkcs12"
        }
    }

    defaultConfig {
        applicationId "org.isomorphisms.crystal.inspect"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "0.2-inspect"
    }

    flavorDimensions += "material"
    productFlavors {
        halite {
            dimension "material"
            applicationIdSuffix ".halite"
            resValue "string", "app_name", "Crystal Halite Inspect"
        }
        quartz {
            dimension "material"
            applicationIdSuffix ".quartz"
            resValue "string", "app_name", "Crystal Quartz Inspect"
        }
        bismuth {
            dimension "material"
            applicationIdSuffix ".bismuth"
            resValue "string", "app_name", "Crystal Bismuth Inspect"
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.stableTest
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
